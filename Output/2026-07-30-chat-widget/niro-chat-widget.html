  var body = p.querySelector('#niro-body'), typing = p.querySelector('#niro-t'), inArea = p.querySelector('#niro-in');

  (function () {

        if (!host) continue;
        var r = host.getBoundingClientRect();
        if (!r.width) continue;
        var dx = ev.clientX - (r.left + r.width / 2);
        var dy = ev.clientY - (r.top + r.height / 2);
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var lim = Math.min(d / 26, 1) * 2.6;

  function say(role, text, skip) {

  var waitTimers = [];

    var timedOut = false;
    var timer = setTimeout(function () { timedOut = true; if (ctrl) ctrl.abort(); }, TIMEOUT_MS);

    payload.channel = 'אתר';
    fetch(HOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(payload).toString(),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { clearTimeout(timer); return r.text(); })
      .then(function (t) { cb(null, (t || '').trim()); })
      .catch(function () {
        clearTimeout(timer);
        /* תקלת רשת חולפת מקבלת ניסיון שני שקט. פסק זמן לא, כדי לא להכפיל המתנה. */
        if (!timedOut && !isRetry) { post(payload, cb, true); return; }
        cb(true, '');
      });
  }

      errEl.textContent = msg;

      if (bad) { fail(bad); return; }
      clearIn(); say('user', v); onDone(v);
    }
    s.addEventListener('click', submit);
    f.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    setTimeout(function () { f.focus(); }, 60);
  }

  function slider(onDone) {
    clearIn();
    var wrap = document.createElement('div'); wrap.className = 'nsl';
    var out = document.createElement('output');
    var r = document.createElement('input');
    r.type = 'range'; r.min = '1500'; r.max = '10000'; r.step = '500'; r.value = '4500';
    r.setAttribute('aria-label', 'בחירת תקציב הקמה בשקלים');
    var ends = document.createElement('div'); ends.className = 'ends';
    ends.innerHTML = '<span>1,500 ₪</span><span>10,000 ₪ ומעלה</span>';
    function fmt(n) { return Number(n).toLocaleString('he-IL'); }
    function refresh() { out.textContent = (r.value === '10000' ? fmt(r.value) + ' ₪ ומעלה' : fmt(r.value) + ' ₪'); }
    r.addEventListener('input', refresh); refresh();
    var go = document.createElement('button');
    go.type = 'button'; go.className = 'nbtn go'; go.textContent = 'זה הסכום שלי';
    go.addEventListener('click', function () {
      var v = r.value; clearIn(); say('user', out.textContent); onDone(Number(v), out.textContent);
    });
    var skip = document.createElement('button');
    skip.type = 'button'; skip.className = 'nbtn'; skip.style.marginTop = '7px'; skip.textContent = 'עדיין לא יודע, רוצה לשמוע קודם';
    skip.addEventListener('click', function () { clearIn(); say('user', 'עדיין לא יודע'); onDone(0, 'לא נמסר'); });
    wrap.appendChild(out); wrap.appendChild(r); wrap.appendChild(ends); wrap.appendChild(go); wrap.appendChild(skip);
    inArea.appendChild(wrap);
  }

  /* ===== אימות ===== */
  function vName(v) { return v.length < 2 ? 'צריך שם מלא, לפחות שתי אותיות' : (v.indexOf(' ') < 0 ? 'אפשר גם שם משפחה? זה עוזר לניר לזהות אתכם' : null); }
  function vPhone(v) { var d = v.replace(/\D/g, ''); return (d.length < 9 || d.length > 11) ? 'המספר לא נראה תקין, אפשר לבדוק?' : null; }
  function vMail(v) { return /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v) ? null : 'הכתובת לא נראית תקינה, אפשר לבדוק?'; }

  /* ===== הפלואו ===== */
  var TASKS = [
    'עונה לאותן שאלות שוב ושוב',
    'מעתיק נתונים ידנית ממקום למקום',
    'מוציא חשבוניות ומסמכים',
    'מתאם פגישות ותורים',
    'רודף אחרי לידים שלא ענו',
    'משהו אחר'
  ];
  var FIELDS = ['נותן שירות', 'קליניקה או טיפול', 'חנות או איקומרס', 'מסעדנות ואירוח', 'אחר'];
  var TIMES = ['בוקר', 'אחרי הצהריים', 'ערב', 'לא משנה'];
  function opts(arr) { return arr.map(function (x) { return { label: x, value: x }; }); }

  function start() {
    if (known()) {
      say('bot', 'היי ' + firstName() + ', טוב לראות אתכם שוב 👋');
      if (S.data.time) { finish(); } else { askTask(); }
      return;
    }
    say('bot', 'היי 👋 אני קרן, העוזרת הבוטית של נירו, ואני כאן בשבילכם. יש לי מתנה: המדריך "5 אוטומציות שכל עסק צריך", קובץ PDF חינם בלי שום התחייבות.');
    buttons([
      { label: '🎁 קחו את המדריך', go: true, k: 'gift' },
      { label: '💬 יש לי שאלה', k: 'ask' }
    ], function (it) {
      if (it.k === 'ask') { chatMode('שאלו אותי כל דבר על אוטומציות, על איך זה עובד או על מה מתאים לעסק שלכם.'); }
      else { askName(); }
    });
  }

  function askName() {
    say('bot', 'מעולה. שלושה פרטים קצרים, ומיד אחרי זה המדריך אצלכם וניר יוצר קשר לתאם את שיחת האפיון. איך קוראים לכם?');
    textInput({ ph: 'שם מלא', ac: 'name', validate: vName }, function (v) {
      S.data.name = v; save(); askPhone();
    });
  }
  function askPhone() {
    say('bot', 'נעים מאוד ' + firstName() + '. מה מספר הטלפון?');
    textInput({ ph: '05X-XXXXXXX', type: 'tel', ac: 'tel', validate: vPhone }, function (v) {
      S.data.phone = v; save(); askMail();
    });
  }
  function askMail() {
    say('bot', 'ולאיזו כתובת מייל לשלוח את המדריך?');
    textInput({ ph: 'name@example.com', type: 'email', ac: 'email', validate: vMail }, function (v) {
      S.data.email = v; save(); createLead();
    });
  }

  function createLead() {
    wait(true); clearIn();
    post({ action: 'lead', name: S.data.name, phone: S.data.phone, email: S.data.email }, function (err, res) {
      wait(false);
      S.sent = true;
      if (res && res.indexOf('rec') === 0) { S.data.leadId = res; }
      save();
      say('bot', 'תודה ' + firstName() + '! הנה המדריך שלכם 🎁 || ' + GUIDE + ' || להורדת המדריך');
      askTask();
    });
  }

  function askTask() {
    say('bot', 'עוד כמה שאלות קצרות וניר יגיע לשיחה איתכם מוכן. מה חוזר על עצמו אצלכם הכי הרבה, כל שבוע מחדש?');
    buttons(opts(TASKS), function (it) {
      S.data.task = it.value; save();
      say('bot', 'אם יש לכם משימה כזאת, אני מזמינה אתכם לשיחת אפיון של 20 דקות עם ניר בזום, בלי עלות ובלי התחייבות.');
      askField();
    });
  }
  function askField() {
    say('bot', 'באיזה תחום העסק?');
    buttons(opts(FIELDS), function (it) { S.data.field = it.value; save(); askBudget(); });
  }
  function askBudget() {
    say('bot', 'מה התקציב שלכם לפרויקט כזה? הסרגל מתחיל ב-1,500 ש"ח ומגיע עד 10,000 ש"ח ומעלה.');
    slider(function (num, label) { S.data.budget = num; S.data.budgetLabel = label; save(); askTime(); });
  }
  function askTime() {
    say('bot', 'ומתי הכי נוח שניר יחזור אליכם?');
    buttons(opts(TIMES), function (it) { S.data.time = it.value; save(); enrich(); });
  }

  function urgency() {
    var n = Number(S.data.budget || 0);
    if (n >= 5000) return 'רותח';
    if (n > 0) return 'רגיל';
    return 'לא נמסר תקציב';
  }

  function enrich() {
    wait(true); clearIn();
    post({
      action: 'enrich', lead_id: S.data.leadId || '', name: S.data.name, phone: S.data.phone,
      task: S.data.task, field: S.data.field, time: S.data.time,
      /* budget הוא המספר לשדה המטבע ב-CRM, urgency ו-budget_text הם טקסט מוכן.
         Make רק כותב, בלי לחשב. */
      budget: Number(S.data.budget || 0),
      urgency: urgency(), budget_text: S.data.budgetLabel || 'לא נמסר'
    }, function () { wait(false); finish(); });
  }

  function finish() {
    var hot = urgency() === 'רותח';
    say('bot', 'תודה ' + firstName() + '! הכל נשמר אצל ניר, והוא יחזור אליכם לתאם שיחת אפיון של 20 דקות ' + (hot ? 'בהקדם האפשרי' : (S.data.time === 'לא משנה' ? 'בהקדם' : 'ב' + S.data.time)) + '.');
    buttons([
      { label: '💬 לכתוב לניר עכשיו בוואטסאפ', go: true, k: 'wa' },
      { label: '🎁 להוריד שוב את המדריך', k: 'guide' },
      { label: '❓ יש לי עוד שאלה', k: 'ask' }
    ], function (it) {
      if (it.k === 'wa') {
        var txt = 'היי ניר, אני ' + (S.data.name || '') + (S.data.task ? ', מהצ\'אט באתר. מה שחוזר אצלי: ' + S.data.task : ' מהצ\'אט באתר');
        window.open(WA + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
        say('bot', 'פתחתי לכם וואטסאפ עם הודעה מוכנה. נדבר!');
        finish();
      } else if (it.k === 'guide') {
        say('bot', 'בשמחה 🎁 || ' + GUIDE + ' || להורדת המדריך');
        finish();
      } else { chatMode('שאלו אותי כל דבר, אני כאן.'); }
    });
  }

  /* ===== מסלול שאלה חופשית (AI) ===== */
  function chatMode(intro) {
    if (intro) say('bot', intro);
    var busy = false;

    /* כפתור קבוע: לדבר עם ניר. זמין בכל שלב, מעדכן את ניר בוואטסאפ ופותח לו שיחה */
    function addHumanBtn() {
      var h = document.createElement('button');
      h.type = 'button'; h.className = 'nbtn nhuman';
      h.textContent = '🙋 רוצה לדבר עם ניר עצמו';
      h.addEventListener('click', function () {
        if (busy) return;
        busy = true; clearIn(); say('user', 'אני רוצה לדבר עם ניר'); wait(true);
        post({ action: 'chat', message: 'אני רוצה לדבר עם ניר' }, function (err, reply) {
          wait(false); busy = false;
          say('bot', (err || !reply || reply === 'Accepted')
            ? 'בשמחה. ניר עודכן ויחזור אליכם אישית. פתחתי גם וואטסאפ אם נוח לכתוב לו עכשיו.'
            : reply);
          var txt = 'היי ניר, הגעתי מהצ\'אט באתר ואשמח לדבר'
            + (S.data.name ? '. קוראים לי ' + S.data.name : '');
          window.open(WA + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
          render();
        });
      });
      inArea.appendChild(h);
    }

    function render() {
      textInput({ ph: 'כתבו לי כאן...' }, function (v) {
        if (busy) return;
        busy = true; wait(true); clearIn();
        post({ action: 'chat', message: v }, function (err, reply) {
          wait(false); busy = false;
          say('bot', (err || !reply || reply === 'Accepted') ? FALLBACK : reply);
          if (!known()) {
            buttons([
              { label: '✅ להשאיר פרטים, לקבל את המדריך ולתאם שיחה', go: true, k: 'gate' },
              { label: '💬 להמשיך לשאול', k: 'more' },
              { label: '🙋 רוצה לדבר עם ניר עצמו', k: 'human' }
            ], function (it) {
              if (it.k === 'gate') { askName(); }
              else if (it.k === 'human') { render(); inArea.lastChild.click(); }
              else { render(); }
            });
          } else { render(); }
        });
      });
      addHumanBtn();
    }
    render();
  }

  /* ===== פתיחה ===== */
  var started = false;
  function openChat() {
    hideTip(false);
    p.classList.add('open');
    if (!started) { started = true; start(); }
    scrollDown();
  }
  b.addEventListener('click', function () {
    if (p.classList.contains('open')) { p.classList.remove('open'); return; }
    openChat();
  });
  p.querySelector('#niro-x').addEventListener('click', function () { p.classList.remove('open'); });

  /* ===== בועת ההזמנה =====
     בלי תווית קרן היא רק אייקון יפה שאיש לא יודע מה הוא עושה.
     מופיעה אחרי 2.5 שניות, נעלמת לבד, ומנסה שוב פעם אחת בלבד.
     סגירה ידנית או פתיחת הצ'אט מכבות אותה לתמיד במכשיר הזה. */
  var tipTimers = [];
  var tip = document.createElement('div');
  tip.id = 'niro-tip';
  tip.setAttribute('role', 'button');
  tip.setAttribute('tabindex', '0');
  tip.setAttribute('aria-label', 'פתיחת צ\'אט עם קרן');
  tip.innerHTML = '<button class="x" type="button" aria-label="סגירת ההודעה">&times;</button>'
    + '<b>היי, אני קרן 👋</b><span>העוזרת של נירו. לחצו עליי ואשמח לעזור</span>';
  document.body.appendChild(tip);

  function tipDone() { try { return localStorage.getItem('niroTipDone') === '1'; } catch (e) { return false; } }
  function hideTip(forever) {
    tip.classList.remove('on');
    for (var i = 0; i < tipTimers.length; i++) { clearTimeout(tipTimers[i]); }
    tipTimers = [];
    if (forever) { try { localStorage.setItem('niroTipDone', '1'); } catch (e) {} }
  }
  function showTip(seconds) {
    if (p.classList.contains('open') || tipDone() || known()) return;
    tip.classList.add('on');
    tipTimers.push(setTimeout(function () { tip.classList.remove('on'); }, seconds * 1000));
  }
  tip.querySelector('.x').addEventListener('click', function (ev) { ev.stopPropagation(); hideTip(true); });
  tip.addEventListener('click', function () { hideTip(true); openChat(); });
  tip.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); hideTip(true); openChat(); }
  });
  if (!tipDone()) {
    tipTimers.push(setTimeout(function () { showTip(14); }, 2500));
    tipTimers.push(setTimeout(function () { showTip(10); }, 60000));
  }
})();
</script>
