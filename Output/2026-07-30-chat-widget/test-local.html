<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת פלואו הכפתורים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Heebo,sans-serif;background:#f4f7fa;padding:40px;direction:rtl}h1{color:#0b1f5b}</style>
</head><body><h1>בדיקת פלואו הכפתורים</h1><p>מחובר לוובהוק החי.</p>
<!-- ================================================================
  NIRO Digital, ווידג'ט צ'אט AI + פלואו כפתורים (גרסה 3, 2026-07-30)
  הדבקה: GTM (GTM-NXRL4W23) > Tags > NIRO Chat Widget > Custom HTML
  הפלואו רץ בצד הלקוח: כפתורים, סרגל תקציב, ואימות שדות, בלי לשרוף פעולות ב-Make.
  Make נקרא רק פעמיים: יצירת הליד אחרי הפרטים, והעשרה בסוף. AI רק במסלול "יש לי שאלה".
  כיבוי חירום: השהיית התג ב-GTM ופרסום. שום קובץ באתר לא משתנה.
================================================================= -->
<script>
(function () {
  'use strict';
  if (window.__niroChatLoaded) return;
  window.__niroChatLoaded = true;

  /* ===== הגדרות ===== */
  var HOOK = 'https://hook.eu1.make.com/txhxkw5ko7grzepboy3cufluott7qlge';
  var GUIDE = 'https://www.nirodigital.co.il/wp-content/uploads/2026/07/NIRO-5-Automations-HE.pdf';
  var WA = 'https://wa.me/972537142298';
  var TIMEOUT_MS = 35000;
  var FALLBACK = 'סליחה, משהו השתבש אצלי הרגע. אפשר לנסות שוב, או לכתוב לניר ישירות בוואטסאפ: 053-7142298';

  /* ===== זהות ומצב ===== */
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'x-' + Math.floor(Math.random() * 1e12).toString(16) + '-' + Date.now();
  }
  var S = { convId: '', data: {}, history: [], sent: false };
  try {
    S.convId = localStorage.getItem('niroChatId') || '';
    if (!S.convId) { S.convId = 'site:' + uuid(); localStorage.setItem('niroChatId', S.convId); }
    S.data = JSON.parse(localStorage.getItem('niroChatData') || '{}');
    S.history = JSON.parse(localStorage.getItem('niroChatHistory') || '[]');
  } catch (e) { S.convId = 'site:' + uuid(); }
  function save() {
    try {
      localStorage.setItem('niroChatData', JSON.stringify(S.data));
      localStorage.setItem('niroChatHistory', JSON.stringify(S.history.slice(-40)));
    } catch (e) {}
  }
  function firstName() { return (S.data.name || '').trim().split(' ')[0]; }
  function known() { return !!(S.data.name && S.data.phone); }

  /* ===== עיצוב ===== */
  var css = ''
    + '#niro-b{position:fixed;bottom:110px;left:30px;width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#0b1f5b,#26449e);color:#fff;border:none;cursor:pointer;z-index:99990;box-shadow:0 8px 25px rgba(11,31,91,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s}'
    + '#niro-b:hover{transform:scale(1.08)}#niro-b svg{width:30px;height:30px}'
    + '#niro-p{position:fixed;bottom:190px;left:30px;width:370px;max-width:calc(100vw - 24px);height:540px;max-height:calc(100vh - 220px);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(10,16,32,.35);z-index:99991;display:none;flex-direction:column;overflow:hidden;direction:rtl;font-family:Heebo,Arial,sans-serif}'
    + '#niro-p.open{display:flex}'
    + '#niro-h{background:linear-gradient(135deg,#0b1f5b,#0a1020);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;flex:0 0 auto}'
    + '#niro-h .t{font-weight:800;font-size:16px}#niro-h .s{font-size:12px;opacity:.85}'
    + '#niro-x{margin-right:auto;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}'
    + '#niro-body{flex:1 1 auto;overflow-y:auto;padding:14px;background:#f4f7fa;display:flex;flex-direction:column;gap:10px}'
    + '.nm{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}'
    + '.nm.bot{background:#fff;color:#0a1020;border:1px solid #e3e9f2;border-bottom-right-radius:4px;align-self:flex-start}'
    + '.nm.user{background:#0b1f5b;color:#fff;border-bottom-left-radius:4px;align-self:flex-end}'
    + '.nm a{color:#e6463a;font-weight:700}'
    + '#niro-t{display:none;align-self:flex-start;background:#fff;border:1px solid #e3e9f2;border-radius:14px;padding:10px 16px}'
    + '#niro-t span{display:inline-block;width:7px;height:7px;margin:0 2px;background:#0b1f5b;border-radius:50%;animation:nbl 1.2s infinite}'
    + '#niro-t span:nth-child(2){animation-delay:.2s}#niro-t span:nth-child(3){animation-delay:.4s}'
    + '@keyframes nbl{0%,80%,100%{opacity:.25}40%{opacity:1}}'
    + '#niro-in{flex:0 0 auto;padding:12px;background:#fff;border-top:1px solid #e3e9f2}'
    + '.nbtns{display:flex;flex-direction:column;gap:7px}'
    + '.nbtn{font:inherit;font-size:14.5px;font-weight:700;text-align:right;background:#fff;color:#0b1f5b;border:1.5px solid #0b1f5b;border-radius:11px;padding:11px 14px;cursor:pointer;transition:background .15s,color .15s}'
    + '.nbtn:hover{background:#0b1f5b;color:#fff}.nbtn:focus-visible{outline:3px solid #e6463a;outline-offset:2px}'
    + '.nbtn.go{background:#e6463a;color:#fff;border-color:#e6463a}.nbtn.go:hover{filter:brightness(1.08)}'
    + '.nrow{display:flex;gap:8px}'
    + '#nfld{flex:1;border:1px solid #cfd8e6;border-radius:22px;padding:11px 16px;font-size:15px;font-family:inherit;outline:none;direction:rtl}'
    + '#nfld:focus{border-color:#0b1f5b}#nfld.err{border-color:#e6463a}'
    + '#nsend{background:#e6463a;color:#fff;border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:17px;flex:0 0 44px}'
    + '#nsend:disabled{opacity:.5;cursor:default}'
    + '.nerr{color:#e6463a;font-size:12.5px;margin:6px 2px 0;font-weight:700}'
    + '.nsl{padding:2px 4px 0}'
    + '.nsl output{display:block;text-align:center;font-size:22px;font-weight:800;color:#0b1f5b;margin-bottom:8px;font-variant-numeric:tabular-nums}'
    + '.nsl input[type=range]{width:100%;accent-color:#e6463a;height:26px}'
    + '.nsl .ends{display:flex;justify-content:space-between;font-size:12px;color:#56607a;margin-bottom:10px}'
    + '@media(max-width:480px){#niro-p{left:12px;right:12px;bottom:172px;height:62vh}#niro-b{bottom:100px;left:18px;width:58px;height:58px}}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  /* ===== מבנה ===== */
  var b = document.createElement('button');
  b.id = 'niro-b';
  b.setAttribute('aria-label', 'פתיחת צ\'אט עם העוזר של NIRO Digital');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  var p = document.createElement('div');
  p.id = 'niro-p'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'צ\'אט עם העוזר של NIRO Digital');
  p.innerHTML = '<div id="niro-h"><div><div class="t">העוזר של ניר 🤖</div><div class="s">עונה מיד, 24/7</div></div><button id="niro-x" aria-label="סגירה">&times;</button></div>'
    + '<div id="niro-body"><div id="niro-t"><span></span><span></span><span></span></div></div><div id="niro-in"></div>';
  document.body.appendChild(b); document.body.appendChild(p);
  var body = p.querySelector('#niro-body'), typing = p.querySelector('#niro-t'), inArea = p.querySelector('#niro-in');

  /* ===== הודעות ===== */
  function say(role, text, skip) {
    var el = document.createElement('div');
    el.className = 'nm ' + role;
    if (text.indexOf('||') > -1) {
      var parts = text.split('||');
      el.innerHTML = parts[0].replace(/\n/g, '<br>') + ' <a href="' + parts[1] + '" target="_blank" rel="noopener">' + parts[2] + '</a>';
    } else { el.textContent = text; }
    body.insertBefore(el, typing);
    body.scrollTop = body.scrollHeight;
    if (!skip) { S.history.push({ r: role, t: text }); save(); }
  }
  function wait(on) { typing.style.display = on ? 'block' : 'none'; body.scrollTop = body.scrollHeight; }

  /* ===== שליחה ל-Make ===== */
  function post(payload, cb) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    payload.conversation_id = S.convId;
    payload.channel = 'אתר';
    fetch(HOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(payload).toString(),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { clearTimeout(timer); return r.text(); })
      .then(function (t) { cb(null, (t || '').trim()); })
      .catch(function () { clearTimeout(timer); cb(true, ''); });
  }

  /* ===== רכיבי קלט ===== */
  function clearIn() { inArea.innerHTML = ''; }

  function buttons(list, onPick) {
    clearIn();
    var wrap = document.createElement('div'); wrap.className = 'nbtns';
    list.forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'nbtn' + (item.go ? ' go' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', function () { clearIn(); say('user', item.label); onPick(item); });
      wrap.appendChild(btn);
    });
    inArea.appendChild(wrap);
  }

  function textInput(opts, onDone) {
    clearIn();
    var row = document.createElement('div'); row.className = 'nrow';
    var f = document.createElement('input');
    f.id = 'nfld'; f.type = opts.type || 'text'; f.placeholder = opts.ph || ''; f.autocomplete = opts.ac || 'off'; f.maxLength = 200;
    var s = document.createElement('button');
    s.id = 'nsend'; s.type = 'button'; s.setAttribute('aria-label', 'שליחה'); s.textContent = '➤';
    row.appendChild(f); row.appendChild(s); inArea.appendChild(row);
    var errEl = null;
    function fail(msg) {
      f.classList.add('err');
      if (!errEl) { errEl = document.createElement('div'); errEl.className = 'nerr'; inArea.appendChild(errEl); }
      errEl.textContent = msg;
    }
    function submit() {
      var v = (f.value || '').trim();
      var bad = opts.validate ? opts.validate(v) : null;
      if (bad) { fail(bad); return; }
      clearIn(); say('user', v); onDone(v);
    }
    s.addEventListener('click', submit);
    f.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    setTimeout(function () { f.focus(); }, 60);
  }

  function slider(onDone) {
    clearIn();
    var wrap = document.createElement('div'); wrap.className = 'nsl';
    var out = document.createElement('output');
    var r = document.createElement('input');
    r.type = 'range'; r.min = '1500'; r.max = '10000'; r.step = '500'; r.value = '4500';
    r.setAttribute('aria-label', 'בחירת תקציב הקמה בשקלים');
    var ends = document.createElement('div'); ends.className = 'ends';
    ends.innerHTML = '<span>1,500 ₪</span><span>10,000 ₪ ומעלה</span>';
    function fmt(n) { return Number(n).toLocaleString('he-IL'); }
    function refresh() { out.textContent = (r.value === '10000' ? fmt(r.value) + ' ₪ ומעלה' : fmt(r.value) + ' ₪'); }
    r.addEventListener('input', refresh); refresh();
    var go = document.createElement('button');
    go.type = 'button'; go.className = 'nbtn go'; go.textContent = 'זה הסכום שלי';
    go.addEventListener('click', function () {
      var v = r.value; clearIn(); say('user', out.textContent); onDone(Number(v), out.textContent);
    });
    var skip = document.createElement('button');
    skip.type = 'button'; skip.className = 'nbtn'; skip.style.marginTop = '7px'; skip.textContent = 'עדיין לא יודע, רוצה לשמוע קודם';
    skip.addEventListener('click', function () { clearIn(); say('user', 'עדיין לא יודע'); onDone(0, 'לא נמסר'); });
    wrap.appendChild(out); wrap.appendChild(r); wrap.appendChild(ends); wrap.appendChild(go); wrap.appendChild(skip);
    inArea.appendChild(wrap);
  }

  /* ===== אימות ===== */
  function vName(v) { return v.length < 2 ? 'צריך שם מלא, לפחות שתי אותיות' : (v.indexOf(' ') < 0 ? 'אפשר גם שם משפחה? זה עוזר לניר לזהות אתכם' : null); }
  function vPhone(v) { var d = v.replace(/\D/g, ''); return (d.length < 9 || d.length > 11) ? 'המספר לא נראה תקין, אפשר לבדוק?' : null; }
  function vMail(v) { return /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v) ? null : 'הכתובת לא נראית תקינה, אפשר לבדוק?'; }

  /* ===== הפלואו ===== */
  var TASKS = [
    'עונה לאותן שאלות שוב ושוב',
    'מעתיק נתונים ידנית ממקום למקום',
    'מוציא חשבוניות ומסמכים',
    'מתאם פגישות ותורים',
    'רודף אחרי לידים שלא ענו',
    'משהו אחר'
  ];
  var FIELDS = ['נותן שירות', 'קליניקה או טיפול', 'חנות או איקומרס', 'מסעדנות ואירוח', 'אחר'];
  var TIMES = ['בוקר', 'אחרי הצהריים', 'ערב', 'לא משנה'];
  function opts(arr) { return arr.map(function (x) { return { label: x, value: x }; }); }

  function start() {
    if (known()) {
      say('bot', 'היי ' + firstName() + ', טוב לראות אתכם שוב 👋');
      if (S.data.time) { finish(); } else { askTask(); }
      return;
    }
    say('bot', 'היי 👋 אני העוזר של ניר. יש לי מתנה בשבילכם: המדריך "5 אוטומציות שכל עסק צריך", קובץ PDF חינם בלי שום התחייבות.');
    buttons([
      { label: '🎁 קחו את המדריך', go: true, k: 'gift' },
      { label: '💬 יש לי שאלה', k: 'ask' }
    ], function (it) {
      if (it.k === 'ask') { chatMode('שאלו אותי כל דבר על אוטומציות, מחירים או איך זה עובד.'); }
      else { askName(); }
    });
  }

  function askName() {
    say('bot', 'מעולה. איך קוראים לכם?');
    textInput({ ph: 'שם מלא', ac: 'name', validate: vName }, function (v) {
      S.data.name = v; save(); askPhone();
    });
  }
  function askPhone() {
    say('bot', 'נעים מאוד ' + firstName() + '. מה מספר הטלפון?');
    textInput({ ph: '05X-XXXXXXX', type: 'tel', ac: 'tel', validate: vPhone }, function (v) {
      S.data.phone = v; save(); askMail();
    });
  }
  function askMail() {
    say('bot', 'ולאיזו כתובת מייל לשלוח את המדריך?');
    textInput({ ph: 'name@example.com', type: 'email', ac: 'email', validate: vMail }, function (v) {
      S.data.email = v; save(); createLead();
    });
  }

  function createLead() {
    wait(true); clearIn();
    post({ action: 'lead', name: S.data.name, phone: S.data.phone, email: S.data.email }, function (err, res) {
      wait(false);
      S.sent = true;
      if (res && res.indexOf('rec') === 0) { S.data.leadId = res; }
      save();
      say('bot', 'תודה ' + firstName() + '! הנה המדריך שלכם 🎁 || ' + GUIDE + ' || להורדת המדריך');
      askTask();
    });
  }

  function askTask() {
    say('bot', 'עוד שלוש שאלות קצרות וניר יידע בדיוק איך לעזור לכם. מה חוזר על עצמו אצלכם הכי הרבה, כל שבוע מחדש?');
    buttons(opts(TASKS), function (it) {
      S.data.task = it.value; save();
      say('bot', 'אם יש לכם משימה כזאת, אני מזמין אתכם לשיחת אבחון חינם עם ניר.');
      askField();
    });
  }
  function askField() {
    say('bot', 'באיזה תחום העסק?');
    buttons(opts(FIELDS), function (it) { S.data.field = it.value; save(); askBudget(); });
  }
  function askBudget() {
    say('bot', 'כדי שניר יידע לאיזה כיוון להציע, מה נוח לכם להשקיע בהקמה? אפשר להזיז את הסרגל.');
    slider(function (num, label) { S.data.budget = num; S.data.budgetLabel = label; save(); askTime(); });
  }
  function askTime() {
    say('bot', 'ומתי הכי נוח שניר יחזור אליכם?');
    buttons(opts(TIMES), function (it) { S.data.time = it.value; save(); enrich(); });
  }

  function enrich() {
    wait(true); clearIn();
    post({
      action: 'enrich', lead_id: S.data.leadId || '', name: S.data.name, phone: S.data.phone,
      task: S.data.task, field: S.data.field, budget: String(S.data.budget || 0), time: S.data.time
    }, function () { wait(false); finish(); });
  }

  function finish() {
    var hot = Number(S.data.budget || 0) >= 5000;
    say('bot', 'תודה ' + firstName() + '! הכל נשמר אצל ניר. ' + (hot ? 'הוא יחזור אליכם בהקדם האפשרי' : 'הוא יחזור אליכם ב' + (S.data.time === 'לא משנה' ? 'הקדם' : S.data.time)) + '.');
    buttons([
      { label: '💬 לדבר עם ניר עכשיו בוואטסאפ', go: true, k: 'wa' },
      { label: '🎁 להוריד שוב את המדריך', k: 'guide' },
      { label: '❓ יש לי עוד שאלה', k: 'ask' }
    ], function (it) {
      if (it.k === 'wa') {
        var txt = 'היי ניר, אני ' + (S.data.name || '') + (S.data.task ? ', מהצ\'אט באתר. מה שחוזר אצלי: ' + S.data.task : ' מהצ\'אט באתר');
        window.open(WA + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
        say('bot', 'פתחתי לכם וואטסאפ עם הודעה מוכנה. נדבר!');
        finish();
      } else if (it.k === 'guide') {
        say('bot', 'בשמחה 🎁 || ' + GUIDE + ' || להורדת המדריך');
        finish();
      } else { chatMode('שאלו אותי כל דבר, אני כאן.'); }
    });
  }

  /* ===== מסלול שאלה חופשית (AI) ===== */
  function chatMode(intro) {
    if (intro) say('bot', intro);
    var busy = false;
    function render() {
      textInput({ ph: 'כתבו לי כאן...' }, function (v) {
        if (busy) return;
        busy = true; wait(true); clearIn();
        post({ action: 'chat', message: v }, function (err, reply) {
          wait(false); busy = false;
          say('bot', (err || !reply || reply === 'Accepted') ? FALLBACK : reply);
          if (!known()) {
            buttons([
              { label: '🎁 להשאיר פרטים ולקבל את המדריך', go: true, k: 'gate' },
              { label: '💬 להמשיך לשאול', k: 'more' }
            ], function (it) { if (it.k === 'gate') { askName(); } else { render(); } });
          } else { render(); }
        });
      });
    }
    render();
  }

  /* ===== פתיחה ===== */
  var started = false;
  b.addEventListener('click', function () {
    p.classList.toggle('open');
    if (!p.classList.contains('open')) return;
    if (!started) { started = true; start(); }
    body.scrollTop = body.scrollHeight;
  });
  p.querySelector('#niro-x').addEventListener('click', function () { p.classList.remove('open'); });
})();
</script>

</body></html>
